name: Feature request / Предложить улучшение
description: New use case or improvement / Новый сценарий или улучшение существующего поведения
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / Какую проблему решает предложение
      description: Describe the user scenario, not only the desired implementation. / Опишите пользовательский сценарий, а не только желаемую реализацию.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution / Предлагаемое решение
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / Рассмотренные альтернативы

  - type: checkboxes
    id: checks
    attributes:
      label: Checks / Проверки
      options:
        - label: I searched existing Issues and Discussions. / Я проверил существующие Issues и Discussions.
          required: true
