name: CI

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Parse PowerShell files
        shell: powershell
        run: |
          $files = @(
              'src/convert-opencck-cidr.ps1',
              'tests/run-tests.ps1'
          )

          foreach ($file in $files) {
              $tokens = $null
              $errors = $null

              [System.Management.Automation.Language.Parser]::ParseFile(
                  (Join-Path $PWD $file),
                  [ref] $tokens,
                  [ref] $errors
              ) | Out-Null

              if ($errors.Count -gt 0) {
                  $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
                  exit 1
              }
          }

      - name: Run Windows tests
        shell: powershell
        run: .\tests\run-tests.ps1

      - name: Validate Windows launcher
        shell: cmd
        run: >-
          bin\convert-opencck-cidr.cmd
          -InputPath tests\fixtures\opencck-sample.json
          -OutputPath "%RUNNER_TEMP%\launcher-result.json"

      - name: Build Windows standalone package
        shell: powershell
        run: .\build\windows\build.ps1

      - name: Upload Windows standalone package
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-x64
          path: dist/amnezia-opencck-cidr-converter_windows_x64.zip
          if-no-files-found: error

  unix:
    name: ${{ matrix.name }} / Bash
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            artifact: linux-x64
          - name: macOS
            os: macos-latest
            artifact: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Bash syntax
        shell: bash
        run: |
          bash -n ./src/convert-opencck-cidr.sh
          bash -n ./bin/convert-opencck-cidr.sh
          bash -n ./tests/run-tests.sh

      - name: Run Unix tests
        shell: bash
        run: |
          chmod +x ./src/convert-opencck-cidr.sh
          chmod +x ./bin/convert-opencck-cidr.sh
          chmod +x ./tests/run-tests.sh
          ./tests/run-tests.sh

      - name: Build Unix standalone package
        shell: bash
        run: |
          chmod +x ./build/unix/build.sh
          chmod +x ./build/unix/launcher.sh
          ./build/unix/build.sh

      - name: Upload Unix standalone package
        uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.artifact }}
          path: dist/*.tar.gz
          if-no-files-found: error
